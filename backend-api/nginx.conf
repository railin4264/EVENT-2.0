# EventConnect 2.0 - Production nginx Configuration
# Optimized for high performance, SSL termination, and CDN integration

# Main HTTP context
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Worker connections and performance tuning
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=5r/s;

    # File upload limits
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Buffer sizes
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https: wss: ws:; media-src 'self' https:; object-src 'none'; frame-src 'self' https://www.google.com;" always;

    # SSL/TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Upstream backend servers
    upstream backend_api {
        least_conn;
        server 127.0.0.1:5000;
        # Add more backend servers for load balancing
        # server 127.0.0.1:5001 backup;
        keepalive 32;
    }

    upstream frontend_app {
        least_conn;
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # Cache configuration
    proxy_cache_path /var/cache/nginx/eventconnect levels=1:2 keys_zone=eventconnect_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Log format
    log_format eventconnect '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           '$request_time $upstream_response_time';

    # API Server Configuration
    server {
        listen 80;
        listen [::]:80;
        server_name api.eventconnect.com;

        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.eventconnect.com;

        # SSL certificates (Let's Encrypt recommended)
        ssl_certificate /etc/nginx/ssl/api.eventconnect.com.crt;
        ssl_certificate_key /etc/nginx/ssl/api.eventconnect.com.key;

        access_log /var/log/nginx/api_access.log eventconnect;
        error_log /var/log/nginx/api_error.log;

        # API rate limiting
        limit_req zone=api burst=20 nodelay;

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # API endpoints
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Cache API responses (selective)
            proxy_cache eventconnect_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Socket.IO WebSocket connections
        location /socket.io/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # WebSocket timeout settings
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # File uploads with increased limits
        location /api/upload {
            limit_req zone=uploads burst=10 nodelay;
            client_max_body_size 100M;
            client_body_timeout 300;

            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }

        # Static file serving for uploads
        location /uploads/ {
            alias /var/www/eventconnect/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;

            # Image optimization headers
            location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                try_files $uri $uri/ =404;
            }
        }
    }

    # Frontend Application Configuration
    server {
        listen 80;
        listen [::]:80;
        server_name eventconnect.com www.eventconnect.com;

        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name eventconnect.com www.eventconnect.com;

        # SSL certificates
        ssl_certificate /etc/nginx/ssl/eventconnect.com.crt;
        ssl_certificate_key /etc/nginx/ssl/eventconnect.com.key;

        access_log /var/log/nginx/frontend_access.log eventconnect;
        error_log /var/log/nginx/frontend_error.log;

        # Root directory for static files
        root /var/www/eventconnect/frontend;
        index index.html;

        # Next.js static files with aggressive caching
        location /_next/static/ {
            alias /var/www/eventconnect/frontend/.next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
        }

        # Next.js images optimization
        location /_next/image {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache optimized images
            proxy_cache eventconnect_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Static assets
        location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            try_files $uri $uri/ =404;
        }

        # Service Worker
        location /sw.js {
            expires 0;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ =404;
        }

        # Manifest and PWA files
        location ~* \.(manifest|webmanifest)$ {
            expires 1y;
            add_header Cache-Control "public";
            try_files $uri $uri/ =404;
        }

        # API proxy to backend
        location /api/ {
            proxy_pass https://api.eventconnect.com;
            proxy_set_header Host api.eventconnect.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;
        }

        # Next.js application
        location / {
            try_files $uri $uri/ @nextjs;
        }

        location @nextjs {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Security: Block access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ /(package\.json|yarn\.lock|\.env|\.git) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Additional domains and redirects
    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.eventconnect.com;

        ssl_certificate /etc/nginx/ssl/eventconnect.com.crt;
        ssl_certificate_key /etc/nginx/ssl/eventconnect.com.key;

        # Redirect www to non-www
        return 301 https://eventconnect.com$request_uri;
    }

    # Default server block (catch-all)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;

        ssl_certificate /etc/nginx/ssl/eventconnect.com.crt;
        ssl_certificate_key /etc/nginx/ssl/eventconnect.com.key;

        server_name _;
        return 444; # Close connection without response
    }
}