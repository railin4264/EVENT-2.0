# Release images are built by .github/workflows/deploy.yml.
# Supply real secrets in a private --env-file. No build, migration or volume reset.
services:
  backend:
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}/backend:${RELEASE_TAG:?Define immutable RELEASE_TAG}
    restart: unless-stopped
    ports: ["127.0.0.1:5000:5000"]
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?Define MONGODB_URI}
      REDIS_URL: ${REDIS_URL:?Define REDIS_URL}
      REDIS_REQUIRED: "true"
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Define CORS_ORIGIN}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-}
    volumes: ["backend_uploads:/app/uploads"]
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [eventconnect-network]
  frontend:
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}/frontend:${RELEASE_TAG:?Define immutable RELEASE_TAG}
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
    networks: [eventconnect-network]
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Define MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD}
    volumes: ["mongodb_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [eventconnect-network]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD:?Define REDIS_PASSWORD}"}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [eventconnect-network]
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [backend, frontend]
    networks: [eventconnect-network]
  prometheus:
    image: prom/prometheus:latest
    profiles: [ops]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    networks: [eventconnect-network]
  grafana:
    image: grafana/grafana:latest
    profiles: [ops]
    ports: ["127.0.0.1:3002:3000"]
    environment: {GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-}"}
    volumes: ["grafana_data:/var/lib/grafana", "./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro", "./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro"]
    depends_on: [prometheus]
    networks: [eventconnect-network]
  backup:
    image: mongo:7.0
    restart: unless-stopped
    profiles: [ops]
    environment: {MONGO_URI: "${MONGODB_URI:?Define MONGODB_URI}"}
    volumes: ["./backups:/backups"]
    command:
      - sh
      - -ec
      - |
        umask 077
        while true; do
          mongodump --uri="$$MONGO_URI" --archive="/backups/$$(date +%Y%m%d_%H%M%S).archive.gz" --gzip
          sleep 86400
        done
    depends_on: [mongodb]
    networks: [eventconnect-network]
volumes:
  mongodb_data:
  redis_data:
  backend_uploads:
  prometheus_data:
  grafana_data:
networks:
  eventconnect-network:
    driver: bridge
