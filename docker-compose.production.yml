version: '3.8'

services:
  app:
    container_name: eventconnect-backend
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/eventconnect_prod
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs:/app/logs
      - static_assets:/app/frontend/dist
    restart: unless-stopped
    networks:
      - eventconnect-network

  mongodb:
    container_name: eventconnect-mongodb
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=eventconnect_prod
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - eventconnect-network

  redis:
    container_name: eventconnect-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - eventconnect-network

  nginx:
    container_name: eventconnect-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - static_assets:/app/frontend/dist
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - eventconnect-network

  # Monitoring services
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - eventconnect-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - eventconnect-network

  # Backup service
  backup:
    image: mongo:6.0
    volumes:
      - mongodb_data:/data/db:ro
      - ./backups:/backups
    environment:
      - MONGO_URI=mongodb://mongodb:27017/eventconnect_prod
    command: >
      sh -c "
        while true; do
          mongodump --uri=$$MONGO_URI --out=/backups/$$(date +%Y%m%d_%H%M%S)
          find /backups -type d -mtime +7 -exec rm -rf {} +
          sleep 86400
        done
      "
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - eventconnect-network

volumes:
  mongodb_data:
  redis_data:
  prometheus_data:
  grafana_data:
  static_assets:

networks:
  eventconnect-network:
    driver: bridge
















