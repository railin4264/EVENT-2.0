# ============================================
# EventConnect 2.0 - Docker Compose
# ============================================
# Uso: docker-compose up -d
# Ver logs: docker-compose logs -f

version: '3.8'

services:
  # ============================================
  # Base de Datos - MongoDB
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: eventconnect-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: eventconnect
      MONGO_INITDB_ROOT_PASSWORD: eventconnect_secret_2024
      MONGO_INITDB_DATABASE: eventconnect
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - eventconnect-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/eventconnect --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Cache - Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: eventconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass eventconnect_redis_2024
    volumes:
      - redis_data:/data
    networks:
      - eventconnect-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "eventconnect_redis_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API
  # ============================================
  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: eventconnect-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://eventconnect:eventconnect_secret_2024@mongodb:27017/eventconnect?authSource=admin
      REDIS_URL: redis://:eventconnect_redis_2024@redis:6379
      CORS_ORIGIN: http://localhost:3000,http://localhost:8081
      JWT_SECRET: eventconnect_super_secret_jwt_key_2024_secure_string_min_64_chars_length_to_be_safe
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventconnect-network
    volumes:
      - ./backend-api/src:/app/src:ro
      - backend_uploads:/app/uploads

  # ============================================
  # Frontend Web
  # ============================================
  frontend:
    build:
      context: ./eventconnect-frontend
      dockerfile: Dockerfile
    container_name: eventconnect-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - eventconnect-network

  # ============================================
  # Nginx Reverse Proxy (Opcional)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: eventconnect-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - eventconnect-network
    profiles:
      - production

# ============================================
# Volúmenes Persistentes
# ============================================
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

# ============================================
# Red
# ============================================
networks:
  eventconnect-network:
    driver: bridge
