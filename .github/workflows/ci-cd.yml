# Compatibility entry point; quality checks run in ci.yml on pushes and PRs.
name: Manual release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
  packages: write
jobs:
  release:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
